# Builds the Windows installer on GitHub's own Windows machine and uploads
# it into the GitHub Release for the version in package.json — no personal
# token or local build needed. Create the release on GitHub first (see
# RELEASE.md), then run this and "Publish macOS Release".
name: Publish Windows Release

on:
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The release page has to exist before electron-builder uploads: it
      # uploads several files at once, and each would try to create it,
      # so all but one failed. Create it here (notes come at the end).
      - name: Make sure the release page exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$V" --repo "$GITHUB_REPOSITORY" --title "${V#v}" --notes "Riftgate ${V#v}. Notes are on their way." --target "$GITHUB_SHA" || gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Build and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Upload into the existing release even if it was created more
          # than 2 hours ago.
          EP_GH_IGNORE_TIME: "true"

  # Every release page gets its notes from the in-app changelog.
  notes:
    needs: release-windows
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
