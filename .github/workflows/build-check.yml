name: Build Check

# Builds Riftgate on both Windows and macOS from the same commit,
# without publishing anything. This is a safety net for the shared
# codebase / services/platform split: if a change to shared code (or
# to main.js's platform-abstraction wiring) breaks the Mac build, this
# catches it on every push instead of only when someone gets around to
# testing on a real Mac. The repo is public, so macOS runner minutes
# are free — no cost to running this on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Sections stay independent, and outside sources fail gracefully
      # (scripts/deps-rules.js, engine/providers.js): fast checks first.
      - name: Section boundaries
        run: node scripts/check-deps.js
      - name: Outside sources (providers)
        run: node tests/providers.test.js
      - name: Steam achievements
        run: node tests/achievements.test.js
      - name: Steam news, this season's anime, free audiobooks
        run: node tests/content.test.js
      - name: Back up and restore
        run: node tests/backup.test.js
      - name: Import from Letterboxd, Goodreads, IMDb, MyAnimeList and Steam
        run: node tests/imports.test.js
      - name: Buy now or wait, will it run on this PC
        run: node tests/game-check.test.js
      - name: Game saves in backups
        run: node tests/game-saves.test.js
      - name: Steam shortcuts dropped on Riftgate
        run: node tests/steam-ids.test.js
      - name: New suggestions for admins
        run: node tests/suggestions.test.js
      - name: Languages (the translator and the Portuguese file)
        run: node --no-warnings tests/i18n.test.js
      - name: Guides & mods for Library games
        run: node tests/game-guides.test.js
      - name: "The Dune: Awakening companion (rankings, recipes, where things drop)"
        run: node tests/dune.test.js
      - name: The Watch page's videos (channel feeds, the most watched, about yours)
        run: node tests/videos.test.js
      - name: The Christmas Rift (dates, themes that carry a season, Ask the Rift, pictures)
        run: node --no-warnings tests/christmas.test.js
      - name: Engine loads and every handler is callable
        run: node scripts/engine-surface.js --call --check

      - name: Build (packaged, not published)
        run: npx electron-builder --publish never
        env:
          # Never try to auto-discover/use a local signing identity in CI.
          # Harmless either way right now since no cert secrets exist yet
          # (see release-mac.yml for where those will go once Alfredo has
          # an Apple Developer account) — this just keeps the Mac build
          # from stalling on a signing prompt that can never be answered
          # in a headless runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Every page opens: the interface in a headless Chromium with a stand-in for
  # the engine, visiting each page of the rail and Settings (scripts/smoke.js).
  # A JavaScript error, or a page showing "This section couldn't open", fails it.
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # (in a folder of its own, so Riftgate's own dependencies, Electron included, aren't downloaded)
      - name: Playwright and its Chromium
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Every page opens without an error
        run: node scripts/smoke.js
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
